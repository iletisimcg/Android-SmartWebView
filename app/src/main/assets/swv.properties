# ===================================================================
#      Anne Ajandası - Main Configuration File
# ===================================================================

build.application.id=com.anneajandasi.app
build.version.code=1
build.version.name=1.0

build.sdk.compile=37
build.sdk.min=24

debug.mode=false

app.url=https://anneajandasi.com.tr
offline.url=file:///android_asset/web/offline.html
search.url=https://www.google.com/search?q=
external.url.exception.list=anneajandasi.com.tr,www.anneajandasi.com.tr

feature.uploads=true
feature.camera.uploads=true
feature.multiple.uploads=true
feature.custom.css=false
feature.copy.paste=true
feature.pull.refresh=true
feature.progress.bar=true
feature.zoom=false
feature.save.form=false
feature.open.external.urls=true
feature.chrome.tabs=true
behavior.back.exits=false
feature.exit.dialog=true

permissions.on.launch=NOTIFICATIONS

security.verify.ssl=true
security.block.screenshots=false
security.accept.thirdparty.cookies=false

ui.orientation=1
ui.layout=1
ui.drawer.header=true
ui.splash.extend=true

agent.postfix.enabled=true
agent.postfix.value=AnneAjandasi
agent.override.enabled=false

analytics.gtag.id=

plugins.enabled=RatingPlugin,NetworkInfoPlugin,SharePlugin,DialogPlugin,AdMobPlugin

plugins.playground.enabled=false

rating.install.days=3
rating.launch.times=5
rating.remind.interval=2
